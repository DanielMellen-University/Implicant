<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1f1e1d">
    <title>Implicant — Interactive Karnaugh map solver</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./ui.js"></script>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand"><h1>Implicant</h1><p class="subtitle">Interactive Karnaugh map solver</p></div>
        <fieldset class="segmented variable-control" aria-label="Variable count">
          <legend>Variables</legend>
          <div id="variable-count" class="segment-row"></div>
        </fieldset>
      </header>

      <section class="workspace" aria-label="Karnaugh map and solution">
        <section class="map-section" aria-label="Karnaugh map">
          <div class="map-toolbar">
            <fieldset class="segmented paint-control" aria-label="Paint value">
              <legend>Paint value</legend>
              <div class="segment-row">
                <button type="button" data-paint="0" aria-pressed="true">0</button>
                <button type="button" data-paint="1" aria-pressed="false">1</button>
                <button type="button" data-paint="2" aria-pressed="false">X</button>
              </div>
            </fieldset>
            <button id="cycle-mode" class="cycle-mode" type="button" aria-pressed="true">Cycle taps</button>
            <div id="layer-tabs" class="layer-tabs" role="tablist" aria-label="Map layers"></div>
          </div>
          <div id="kmap" class="kmap" role="group" aria-label="Karnaugh map"></div>
          <p id="map-hint" class="hint">Choose a value to paint; touch taps cycle unless a paint value is selected.</p>
          <nav class="map-actions" aria-label="Map actions">
            <button id="randomize" type="button">Randomize</button>
            <button id="clear" type="button">Clear</button>
          </nav>
        </section>

        <aside class="solution">
          <section class="answer" aria-live="polite" aria-atomic="true">
            <div class="answer-heading">
              <div id="answer-label" class="answer-label">Minimal SOP</div>
              <fieldset class="segmented form-control" aria-label="Expression form">
                <legend>Expression form</legend>
                <div class="segment-row">
                  <button type="button" data-form="SOP" aria-pressed="true">SOP</button>
                  <button type="button" data-form="POS" aria-pressed="false">POS</button>
                </div>
              </fieldset>
            </div>
            <div id="expression" class="expression">F = 0</div>
          </section>
          <section id="legend" class="legend" aria-label="Selected groups"></section>
        </aside>
      </section>

      <section class="extras" aria-label="Solver details">
        <details class="extra-panel">
          <summary>Minterm list</summary>
          <p id="minterm-list" class="detail-copy"></p>
        </details>
        <details class="extra-panel">
          <summary>Truth table</summary>
          <div class="truth-table-scroll">
            <table id="truth-table" class="truth-table"></table>
          </div>
          <p class="detail-note">Select a row’s F value to set it to the chosen paint value.</p>
        </details>
        <details id="explanation-panel" class="extra-panel">
          <summary>Why these groups work</summary>
          <div id="explanation" class="detail-copy"></div>
        </details>
      </section>
    </main>
  </body>
</html>
