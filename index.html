<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#faf9f5">
    <title>Implicant — 4-variable Karnaugh map</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./ui.js"></script>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <h1>Implicant</h1>
          <p class="subtitle">Build a truth table on the map and get the minimal sum-of-products expression.</p>
        </div>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch theme">
          <span aria-hidden="true">◐</span><span class="theme-label">Theme</span>
        </button>
      </header>

      <section class="map-section" aria-label="Four-variable Karnaugh map">
        <div id="kmap" class="kmap" role="group" aria-label="4 by 4 Karnaugh map; rows AB and columns CD"></div>
        <p class="hint">Tap a cell to cycle 0, 1, X (don’t care). Rows are AB, columns are CD.</p>
      </section>

      <section class="answer" aria-live="polite" aria-atomic="true">
        <div class="answer-label">Minimal expression</div>
        <div id="expression" class="expression">F = 0</div>
      </section>

      <section id="legend" class="legend" aria-label="Selected groups"></section>

      <nav class="presets" aria-label="Map presets">
        <button type="button" data-preset="corners">Four corners</button>
        <button type="button" data-preset="two-groups">Two groups</button>
        <button type="button" data-preset="dont-cares">With don’t cares</button>
        <button type="button" data-preset="concept">Concept example</button>
        <button type="button" data-preset="clear">Clear</button>
      </nav>
    </main>
  </body>
</html>
